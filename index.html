<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitación Digital</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f4ef;
  color:#282828;
}
header{
  padding:32px 20px;
  text-align:center;
  background:#fff;
  border-bottom:1px solid #eee;
}
.logo{
  font-family:Georgia,serif;
  font-size:30px;
  margin:0;
}
.sub{
  color:#777;
  margin-top:8px;
  font-size:14px;
}
main{
  max-width:600px;
  margin:auto;
  padding:24px 18px 60px;
}
.card{
  background:#fff;
  border-radius:22px;
  padding:24px 20px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
  margin-bottom:18px;
}
h2{
  font-family:Georgia,serif;
  margin-top:0;
}
label{
  display:block;
  margin:18px 0 7px;
  font-weight:600;
}
input,textarea,select{
  width:100%;
  padding:14px;
  border:1px solid #d9d5cf;
  border-radius:12px;
  font-size:16px;
  background:white;
}
textarea{
  min-height:100px;
  resize:vertical;
}
button{
  width:100%;
  margin-top:22px;
  padding:16px;
  border:0;
  border-radius:14px;
  font-size:17px;
  font-weight:700;
  background:#222;
  color:#fff;
}
button:disabled{
  opacity:.55;
}
.notice{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  font-size:14px;
}
.ok{background:#e9f7ef;color:#17663a}
.error{background:#fdecec;color:#9c2525}
.small{
  color:#777;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<header>
  <h1 class="logo">Invitación Digital</h1>
  <div class="sub">Diseño personalizado para momentos inolvidables</div>
</header>

<main>

<div class="card">
  <h2>Cuéntanos sobre tu evento</h2>

  <p class="small">
    Completa este formulario para comenzar a crear tu invitación personalizada.
  </p>

  <form id="formulario">

    <label>Nombre</label>
    <input id="nombre" required placeholder="Tu nombre">

    <label>WhatsApp</label>
    <input id="whatsapp" type="tel" required placeholder="Número de contacto">

    <label>Tipo de evento</label>
    <select id="evento" required>
      <option value="">Selecciona una opción</option>
      <option>Boda</option>
      <option>XV años</option>
      <option>Bautizo</option>
      <option>Primera comunión</option>
      <option>Cumpleaños</option>
      <option>Baby shower</option>
      <option>Evento empresarial</option>
      <option>Otro</option>
    </select>

    <label>Fecha del evento</label>
    <input id="fecha" type="date">

    <label>Cuéntanos tu idea</label>
    <textarea id="mensaje"
      placeholder="Colores, estilo, temática y cualquier detalle que quieras incluir..."></textarea>

    <label>Archivo o imagen de referencia</label>
    <input id="archivo" type="file" accept="image/*,.pdf">

    <button id="enviar" type="submit">
      Enviar información
    </button>

    <div id="resultado" class="notice"></div>

  </form>
</div>

</main>

<script>
const SUPABASE_URL =
"https://lsfgtiprbbobtxqqyiwj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7JhdsnxD3Li6iw8CpjERMg_wNQBN81c";

const form = document.getElementById("formulario");
const resultado = document.getElementById("resultado");
const boton = document.getElementById("enviar");

function aviso(texto,tipo){
  resultado.textContent=texto;
  resultado.className="notice "+tipo;
  resultado.style.display="block";
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();

  boton.disabled=true;
  boton.textContent="Enviando...";

  try{

    const archivo =
      document.getElementById("archivo").files[0];

    let archivoUrl="";

    if(archivo){

      const nombreArchivo =
        Date.now()+"-"+archivo.name.replace(/\s+/g,"-");

      const subida=await fetch(
        SUPABASE_URL+
        "/storage/v1/object/archivos-clientes/"+
        encodeURIComponent(nombreArchivo),
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+SUPABASE_KEY,
            "Content-Type":archivo.type
          },
          body:archivo
        }
      );

      if(!subida.ok)
        throw new Error("No se pudo subir el archivo");

      archivoUrl =
        SUPABASE_URL+
        "/storage/v1/object/public/archivos-clientes/"+
        encodeURIComponent(nombreArchivo);
    }

    aviso(
      "¡Información recibida correctamente! Gracias.",
      "ok"
    );

    form.reset();

  }catch(error){

    console.error(error);

    aviso(
      "No pudimos enviar el archivo. Intenta nuevamente.",
      "error"
    );

  }finally{

    boton.disabled=false;
    boton.textContent="Enviar información";

  }
});
</script>

</body>
</html>
