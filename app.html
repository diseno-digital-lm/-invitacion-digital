<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseño Digital LM</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080808;
 color:#f7f2e8;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.contenedor{
 max-width:560px;
 margin:auto;
 padding:35px 18px 70px;
}
.marca{
 text-align:center;
 color:#d4af37;
 font-family:Georgia,serif;
 letter-spacing:2px;
 margin-bottom:5px;
}
.subtitulo{
 text-align:center;
 color:#aaa;
 margin-bottom:35px;
}
.tarjeta{
 background:#111;
 border:1px solid #8f762c;
 border-radius:22px;
 padding:25px 20px;
}
h2{
 color:#d4af37;
 font-family:Georgia,serif;
 text-align:center;
}
label{
 display:block;
 margin:18px 0 7px;
 font-weight:600;
}
input,select,textarea{
 width:100%;
 padding:14px;
 border-radius:12px;
 border:1px solid #665726;
 background:#181818;
 color:white;
 font-size:16px;
}
textarea{
 min-height:120px;
 resize:vertical;
}
button{
 width:100%;
 margin-top:25px;
 padding:16px;
 border:0;
 border-radius:13px;
 background:#d4af37;
 color:#080808;
 font-size:16px;
 font-weight:800;
}
button:disabled{opacity:.55}
#mensaje{
 display:none;
 margin-top:18px;
 padding:14px;
 border-radius:10px;
 text-align:center;
}
.exito{
 display:block!important;
 background:#153820;
 color:#fff;
}
.error{
 display:block!important;
 background:#4a1717;
 color:#fff;
}
</style>
</head>

<body>

<div class="contenedor">

<h1 class="marca">DISEÑO DIGITAL LM</h1>
<p class="subtitulo">
Cada celebración comienza con una invitación inolvidable
</p>

<div class="tarjeta">

<h2>Cuéntanos sobre tu evento</h2>

<form id="formulario">

<label>Nombre de contacto *</label>
<input id="nombre" required
placeholder="Escribe tu nombre">

<label>WhatsApp *</label>
<input id="whatsapp" type="tel" required
placeholder="Número de contacto">

<label>Tipo de evento *</label>
<select id="tipo" required>
<option value="">Selecciona tu evento</option>
<option value="xv_anos">XV años</option>
<option value="boda">Boda</option>
<option value="bautizo">Bautizo</option>
<option value="cumpleanos">Cumpleaños</option>
</select>

<label>Fecha del evento</label>
<input id="fecha" type="date">

<label>Paleta de colores</label>
<input id="colores"
placeholder="Ej. rosa, dorado y beige">

<label>Información adicional</label>
<textarea id="informacion"
placeholder="Cuéntanos cualquier detalle, petición o información especial que quieras incluir..."></textarea>

<button id="boton" type="submit">
ENVIAR INFORMACIÓN
</button>

<div id="mensaje"></div>

</form>

</div>
</div>

<script>

const SUPABASE_URL =
"https://lsfgtiprbbobtxqqyiwj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7JhdsnxD3Li6iw8CpjERMg_wNQBN81c";

const formulario =
document.getElementById("formulario");

const boton =
document.getElementById("boton");

const mensaje =
document.getElementById("mensaje");


formulario.addEventListener("submit", async function(e){

 e.preventDefault();

 boton.disabled=true;
 boton.textContent="ENVIANDO...";

 mensaje.style.display="none";
 mensaje.className="";

 const datos={

   tipo_evento:
   document.getElementById("tipo").value,

   nombre_cliente:
   document.getElementById("nombre").value.trim(),

   whatsapp:
   document.getElementById("whatsapp").value.trim(),

   fecha_evento:
   document.getElementById("fecha").value || null,

   respuestas:{
     paleta_colores:
     document.getElementById("colores").value.trim(),

     informacion_adicional:
     document.getElementById("informacion").value.trim()
   }

 };

 try{

   const respuesta=await fetch(
     SUPABASE_URL+"/rest/v1/solicitudes",
     {
       method:"POST",

       headers:{
         "apikey":SUPABASE_KEY,
         "Authorization":"Bearer "+SUPABASE_KEY,
         "Content-Type":"application/json",
         "Prefer":"return=representation"
       },

       body:JSON.stringify(datos)
     }
   );

   const resultado=await respuesta.json();

   if(!respuesta.ok){
     console.error(resultado);
     throw new Error(resultado.message || "Error");
   }

   const folio=
     resultado[0] && resultado[0].folio
     ? resultado[0].folio
     : "";

   mensaje.innerHTML=
     "✓ ¡Información recibida correctamente!"+
     (folio ? "<br><strong>Folio: "+folio+"</strong>" : "");

   mensaje.className="exito";

   formulario.reset();

 }catch(error){

   console.error(error);

   mensaje.textContent=
   "No pudimos enviar la información. Intenta nuevamente.";

   mensaje.className="error";

 }

 boton.disabled=false;
 boton.textContent="ENVIAR INFORMACIÓN";

});

</script>

</body>
</html>
